<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lugia Obscur (XD001) — Cinématique 3D & Tornade Obscure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #030408;
    color: #e0f0ff;
    font-family: 'Chakra Petch', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  #gl-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  /* Overlay HUD */
  .hud-top {
    position: absolute;
    top: 20px;
    left: 24px;
    z-index: 10;
    pointer-events: none;
  }
  .hud-title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #ffffff;
    text-shadow: 0 0 16px rgba(0, 224, 255, 0.8), 0 2px 4px #000;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .hud-badge {
    background: linear-gradient(135deg, #7928ca, #ff0080);
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    box-shadow: 0 0 10px rgba(255, 0, 128, 0.5);
  }
  .hud-sub {
    font-size: 14px;
    color: #8da4c4;
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  /* Control buttons bottom */
  .controls-bar {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    z-index: 10;
    background: rgba(10, 15, 26, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 224, 255, 0.35);
    padding: 10px 18px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(0, 224, 255, 0.15);
  }
  .btn-3d {
    background: linear-gradient(180deg, #16243b 0%, #0d1624 100%);
    border: 1px solid #00e0ff;
    color: #ffffff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-3d:hover {
    background: linear-gradient(180deg, #1e3658 0%, #112034 100%);
    box-shadow: 0 0 15px rgba(0, 224, 255, 0.6);
    transform: translateY(-2px);
  }
  .btn-3d.active {
    background: linear-gradient(180deg, #00b4d8 0%, #0077b6 100%);
    border-color: #ffffff;
    box-shadow: 0 0 20px rgba(0, 224, 255, 0.8);
  }
  .btn-tornado {
    border-color: #d946ef;
    background: linear-gradient(180deg, #3b185f 0%, #200d34 100%);
  }
  .btn-tornado:hover {
    background: linear-gradient(180deg, #581c87 0%, #3b185f 100%);
    box-shadow: 0 0 18px rgba(217, 70, 239, 0.7);
  }

  /* Flash overlay */
  #flash {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: #fff;
    opacity: 0;
    z-index: 50;
    transition: opacity 0.05s linear;
  }

  /* Status Toast */
  #status-toast {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(14, 20, 34, 0.9);
    border: 1px solid #00e0ff;
    color: #00e0ff;
    padding: 8px 24px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 20;
    box-shadow: 0 0 15px rgba(0, 224, 255, 0.4);
  }
</style>
<script type="importmap">
  { "imports": { "three": "../shared/vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="gl-canvas"></canvas>
<div id="flash"></div>
<div id="status-toast">CINÉMATIQUE 3D EN COURS</div>

<div class="hud-top">
  <div class="hud-title">
    LUGIA OBSCUR <span class="hud-badge">XD001 · 3D ENGINE</span>
  </div>
  <div class="hud-sub">Rendu 3D Temps Réel (Three.js) · Sanctuaire des Marées</div>
</div>

<div class="controls-bar">
  <button type="button" class="btn-3d btn-tornado" id="btn-crash">
    ⚡ CRASH &amp; TORNADE OBSCURE
  </button>
  <button type="button" class="btn-3d" id="btn-orbit">
    🔄 ORBITE LIBRE (SOURIS)
  </button>
  <button type="button" class="btn-3d" id="btn-lightning">
    🌩️ ÉCLAIR OBSCUR
  </button>
  <button type="button" class="btn-3d" id="btn-fullscreen">
    ⛶ PLEIN ÉCRAN
  </button>
</div>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('gl-canvas');
const flashEl = document.getElementById('flash');
const toastEl = document.getElementById('status-toast');

function showToast(text, duration = 2500) {
  toastEl.textContent = text;
  toastEl.style.opacity = '1';
  clearTimeout(toastEl._timer);
  toastEl._timer = setTimeout(() => { toastEl.style.opacity = '0'; }, duration);
}

// 1. Scene, Camera, Renderer
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x060814, 0.015);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 12, 38);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

// 2. Lighting
const ambientLight = new THREE.AmbientLight(0x181432, 1.8);
scene.add(ambientLight);

const moonLight = new THREE.DirectionalLight(0x7090ff, 2.4);
moonLight.position.set(-25, 45, -20);
scene.add(moonLight);

const cyanSpineLight = new THREE.PointLight(0x00e5ff, 4.0, 35, 1.4);
scene.add(cyanSpineLight);

const darkCoreLight = new THREE.PointLight(0x9922dd, 5.0, 45, 1.2);
darkCoreLight.position.set(0, 2, 0);
scene.add(darkCoreLight);

// 3. Stormy Sea Plane
const oceanGeo = new THREE.PlaneGeometry(300, 300, 90, 90);
oceanGeo.rotateX(-Math.PI / 2);
const oceanPos = oceanGeo.attributes.position;
const oceanOrigY = new Float32Array(oceanPos.count);
for (let i = 0; i < oceanPos.count; i++) {
  oceanOrigY[i] = oceanPos.getY(i);
}

const oceanMat = new THREE.MeshStandardMaterial({
  color: 0x050c18,
  roughness: 0.18,
  metalness: 0.85,
  flatShading: true,
});
const oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
scene.add(oceanMesh);

// 4. Volumetric 3D Dark Tornado Particle System
const TORNADO_COUNT = 3800;
const tornadoGeo = new THREE.BufferGeometry();
const tornadoPos = new Float32Array(TORNADO_COUNT * 3);
const tornadoCol = new Float32Array(TORNADO_COUNT * 3);
const tornadoData = [];

for (let i = 0; i < TORNADO_COUNT; i++) {
  const h = Math.random() * 45; // Height 0 to 45
  const baseRadius = 1.5 + (h * 0.45) + (Math.pow(h / 45, 2) * 8.0);
  const angle = Math.random() * Math.PI * 2;
  const speed = 1.8 + Math.random() * 3.5;
  const rSpread = (Math.random() - 0.5) * 2.5;
  const r = Math.max(0.5, baseRadius + rSpread);

  tornadoPos[i * 3 + 0] = Math.cos(angle) * r;
  tornadoPos[i * 3 + 1] = h;
  tornadoPos[i * 3 + 2] = Math.sin(angle) * r;

  tornadoData.push({ h, angle, speed, baseRadius, rSpread });

  // Colors: Obsidian black, deep purple, and vivid cyan sparks
  const colChoice = Math.random();
  if (colChoice < 0.25) {
    // Electric cyan spark
    tornadoCol[i * 3 + 0] = 0.0;
    tornadoCol[i * 3 + 1] = 0.9;
    tornadoCol[i * 3 + 2] = 1.0;
  } else if (colChoice < 0.70) {
    // Deep dark purple / magenta plasma
    tornadoCol[i * 3 + 0] = 0.55;
    tornadoCol[i * 3 + 1] = 0.10;
    tornadoCol[i * 3 + 2] = 0.90;
  } else {
    // Charcoal obsidian smoke
    tornadoCol[i * 3 + 0] = 0.08;
    tornadoCol[i * 3 + 1] = 0.08;
    tornadoCol[i * 3 + 2] = 0.12;
  }
}

tornadoGeo.setAttribute('position', new THREE.BufferAttribute(tornadoPos, 3));
tornadoGeo.setAttribute('color', new THREE.BufferAttribute(tornadoCol, 3));

const tornadoMat = new THREE.PointsMaterial({
  size: 0.65,
  vertexColors: true,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const tornadoParticles = new THREE.Points(tornadoGeo, tornadoMat);
scene.add(tornadoParticles);

// 5. 3D Procedural Shadow Lugia (XD001) Model
const lugiaGroup = new THREE.Group();

// Materials
const bodyMat = new THREE.MeshStandardMaterial({
  color: 0x111624,
  roughness: 0.35,
  metalness: 0.65,
});
const bellyMat = new THREE.MeshStandardMaterial({
  color: 0x5a6878,
  roughness: 0.45,
  metalness: 0.35,
});
const cyanSpineMat = new THREE.MeshStandardMaterial({
  color: 0x00e5ff,
  emissive: 0x00b4d8,
  emissiveIntensity: 2.2,
  roughness: 0.1,
  metalness: 0.9,
});
const redEyeMat = new THREE.MeshStandardMaterial({
  color: 0xff0033,
  emissive: 0xff1144,
  emissiveIntensity: 3.5,
  roughness: 0.1,
});

// Torso / Body
const torsoGeo = new THREE.ConeGeometry(2.4, 7.5, 12);
torsoGeo.rotateX(Math.PI / 2);
const torsoMesh = new THREE.Mesh(torsoGeo, bodyMat);
lugiaGroup.add(torsoMesh);

// Belly plate
const bellyGeo = new THREE.ConeGeometry(2.1, 6.8, 10);
bellyGeo.rotateX(Math.PI / 2);
const bellyMesh = new THREE.Mesh(bellyGeo, bellyMat);
bellyMesh.position.set(0, -0.35, 0.2);
lugiaGroup.add(bellyMesh);

// Long Neck
const neckGeo = new THREE.CylinderGeometry(1.2, 1.8, 4.5, 10);
neckGeo.rotateX(0.35);
const neckMesh = new THREE.Mesh(neckGeo, bodyMat);
neckMesh.position.set(0, 2.2, -4.0);
lugiaGroup.add(neckMesh);

// Head & Snout
const headGeo = new THREE.ConeGeometry(1.3, 3.2, 8);
headGeo.rotateX(-Math.PI / 2);
const headMesh = new THREE.Mesh(headGeo, bodyMat);
headMesh.position.set(0, 3.8, -6.8);
lugiaGroup.add(headMesh);

// Glowing Crimson Eyes (Right & Left)
const eyeGeo = new THREE.BoxGeometry(0.35, 0.22, 0.85);
const leftEye = new THREE.Mesh(eyeGeo, redEyeMat);
leftEye.position.set(0.95, 3.9, -6.6);
leftEye.rotation.y = 0.25;
const rightEye = new THREE.Mesh(eyeGeo, redEyeMat);
rightEye.position.set(-0.95, 3.9, -6.6);
rightEye.rotation.y = -0.25;
lugiaGroup.add(leftEye, rightEye);

// Cyan Dorsal Spikes along Spine
const spineSpikes = [];
for (let s = 0; s < 7; s++) {
  const spikeGeo = new THREE.ConeGeometry(0.42, 1.6 + (s < 4 ? s * 0.25 : (7 - s) * 0.3), 5);
  spikeGeo.rotateX(-0.4);
  const spike = new THREE.Mesh(spikeGeo, cyanSpineMat);
  const zPos = -3.0 + s * 1.5;
  const yPos = 1.3 - s * 0.15;
  spike.position.set(0, yPos, zPos);
  lugiaGroup.add(spike);
  spineSpikes.push(spike);
}

// Articulated Wings (Left & Right)
const leftWingPivot = new THREE.Group();
leftWingPivot.position.set(1.8, 0.8, -0.8);
const rightWingPivot = new THREE.Group();
rightWingPivot.position.set(-1.8, 0.8, -0.8);

function buildWing(isLeft) {
  const group = new THREE.Group();
  const dir = isLeft ? 1 : -1;
  // Main arm
  const armGeo = new THREE.BoxGeometry(7.0, 0.45, 2.2);
  armGeo.translate(dir * 3.5, 0, 0);
  const arm = new THREE.Mesh(armGeo, bodyMat);
  group.add(arm);

  // Hand / Feathered fingers
  for (let f = 0; f < 5; f++) {
    const fingerGeo = new THREE.ConeGeometry(0.35, 3.6 - f * 0.35, 5);
    fingerGeo.rotateZ(dir * (Math.PI / 2 + 0.15 * f));
    const finger = new THREE.Mesh(fingerGeo, bodyMat);
    finger.position.set(dir * (6.5 + f * 0.4), 0, -1.0 + f * 0.9);
    group.add(finger);
  }
  return group;
}

const leftWing = buildWing(true);
leftWingPivot.add(leftWing);
const rightWing = buildWing(false);
rightWingPivot.add(rightWing);
lugiaGroup.add(leftWingPivot, rightWingPivot);

// Long Tail
const tailGeo = new THREE.ConeGeometry(1.2, 8.5, 8);
tailGeo.rotateX(Math.PI / 2 + 0.15);
const tailMesh = new THREE.Mesh(tailGeo, bodyMat);
tailMesh.position.set(0, -0.4, 6.8);
lugiaGroup.add(tailMesh);

// Tail fin
const tailFinGeo = new THREE.ConeGeometry(0.35, 2.2, 5);
tailFinGeo.rotateX(-0.5);
const tailFin = new THREE.Mesh(tailFinGeo, cyanSpineMat);
tailFin.position.set(0, 0.4, 10.5);
lugiaGroup.add(tailFin);

lugiaGroup.position.set(0, 16, 0);
lugiaGroup.scale.set(1.4, 1.4, 1.4);
scene.add(lugiaGroup);

// 6. Camera Animation & Cinematic Director
let mode = 'cinematic'; // 'cinematic' or 'orbit'
let cineTime = 0;
let isCrashing = true;

const btnCrash = document.getElementById('btn-crash');
const btnOrbit = document.getElementById('btn-orbit');
const btnLightning = document.getElementById('btn-lightning');
const btnFullscreen = document.getElementById('btn-fullscreen');

btnCrash.addEventListener('click', () => {
  mode = 'cinematic';
  cineTime = 0;
  isCrashing = true;
  lugiaGroup.position.set(0, 28, -25);
  lugiaGroup.rotation.set(0.65, 0, 0);
  btnCrash.classList.add('active');
  btnOrbit.classList.remove('active');
  showToast('⚡ DÉCLENCHEMENT DU PIQUÉ & CRASH TORNADE');
});

btnOrbit.addEventListener('click', () => {
  mode = 'orbit';
  btnOrbit.classList.add('active');
  btnCrash.classList.remove('active');
  lugiaGroup.position.set(0, 15, 0);
  lugiaGroup.rotation.set(0, 0, 0);
  camera.position.set(0, 18, 36);
  showToast('🔄 MODE ORBITE LIBRE (BOUGE LA SOURIS)');
});

// Sound / Audio FX synth
let audioCtx = null;
function playLightningThunder() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(90, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 1.2);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 1.3);
  } catch (e) {}
}

btnLightning.addEventListener('click', triggerLightning);

function triggerLightning() {
  flashEl.style.opacity = '0.9';
  playLightningThunder();
  setTimeout(() => { flashEl.style.opacity = '0'; }, 80);
  setTimeout(() => {
    flashEl.style.opacity = '0.4';
    setTimeout(() => { flashEl.style.opacity = '0'; }, 60);
  }, 120);
}

btnFullscreen.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
});

// Mouse Orbit Controls
let mouseX = 0, mouseY = 0;
window.addEventListener('mousemove', (e) => {
  if (mode === 'orbit') {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
  }
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 7. Render Loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const time = clock.getElapsedTime();

  // Wave motion
  const pos = oceanMesh.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const u = pos.getX(i);
    const v = pos.getZ(i);
    const wave = Math.sin(u * 0.08 + time * 2.2) * 1.2 + Math.cos(v * 0.09 + time * 1.8) * 0.9;
    pos.setY(i, oceanOrigY[i] + wave);
  }
  pos.needsUpdate = true;

  // Tornado particles rotation
  const tPos = tornadoParticles.geometry.attributes.position;
  for (let i = 0; i < TORNADO_COUNT; i++) {
    const d = tornadoData[i];
    d.angle += d.speed * dt * 1.5;
    const r = Math.max(0.8, d.baseRadius + d.rSpread + Math.sin(time * 3 + d.h * 0.2) * 1.2);
    tPos.setX(i, Math.cos(d.angle) * r);
    tPos.setZ(i, Math.sin(d.angle) * r);
  }
  tPos.needsUpdate = true;

  // Cyan Spines Pulse
  const spineGlow = 2.0 + Math.sin(time * 6) * 1.0;
  cyanSpineMat.emissiveIntensity = spineGlow;
  cyanSpineLight.intensity = 3.0 + Math.sin(time * 6) * 1.8;
  cyanSpineLight.position.copy(lugiaGroup.position).add(new THREE.Vector3(0, 3, 0));

  // Wings Flapping
  const wingAngle = Math.sin(time * (isCrashing ? 9 : 4.5)) * 0.45;
  leftWingPivot.rotation.z = wingAngle;
  rightWingPivot.rotation.z = -wingAngle;

  // Random Thunder
  if (Math.random() < 0.005) triggerLightning();

  // Cinematic Sequences
  if (mode === 'cinematic') {
    cineTime += dt;

    if (cineTime < 3.5) {
      // Phase 1: High speed 3D dive toward ocean
      const p = cineTime / 3.5;
      lugiaGroup.position.set(0, 30 - p * 22, -25 + p * 28);
      lugiaGroup.rotation.x = 0.75;
      camera.position.set(0, 14, 28);
      camera.lookAt(lugiaGroup.position);
    } else if (cineTime < 4.2) {
      // Phase 2: CRASH IMPACT into sea
      if (isCrashing) {
        triggerLightning();
        isCrashing = false;
        showToast('💥 IMPACT : RAFALE OBSCURE DÉCHAÎNÉE !');
      }
      lugiaGroup.position.set(
        (Math.random() - 0.5) * 1.5,
        7.5 + (Math.random() - 0.5) * 0.8,
        3.0
      );
      lugiaGroup.rotation.x = 0.2;
      camera.position.set((Math.random() - 0.5) * 2, 9, 22);
      camera.lookAt(0, 8, 0);
    } else {
      // Phase 3: Majestic 360° Orbital Camera around the Dark Tornado
      const orbTime = cineTime - 4.2;
      lugiaGroup.position.y = 12 + Math.sin(orbTime * 2.0) * 1.5;
      lugiaGroup.rotation.x = Math.sin(orbTime * 1.5) * 0.15;
      lugiaGroup.rotation.y = orbTime * 0.35;

      const camRadius = 34;
      const camAngle = orbTime * 0.45;
      camera.position.x = Math.sin(camAngle) * camRadius;
      camera.position.z = Math.cos(camAngle) * camRadius;
      camera.position.y = 15 + Math.sin(orbTime * 0.8) * 6;
      camera.lookAt(0, 10, 0);
    }
  } else {
    // Mode Orbit
    const targetX = Math.sin(mouseX * Math.PI) * 36;
    const targetZ = Math.cos(mouseX * Math.PI) * 36;
    const targetY = 16 - mouseY * 15;
    camera.position.x += (targetX - camera.position.x) * 0.05;
    camera.position.z += (targetZ - camera.position.z) * 0.05;
    camera.position.y += (targetY - camera.position.y) * 0.05;
    camera.lookAt(0, 14, 0);
  }

  renderer.render(scene, camera);
}

// Start
btnCrash.click();
animate();
</script>
</body>
</html>
