<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Odyssée — banc d'essai du moteur façon HGSS</title>
<!-- écrans d'Odyssée (combat, équipe, sac, boîtes) : la page est à côté d'odyssee/index.html pour que leurs images se trouvent -->
<link rel="stylesheet" href="css/00-base.css">
<link rel="stylesheet" href="css/01-equipe.css">
<link rel="stylesheet" href="css/02-resume.css">
<link rel="stylesheet" href="css/03-sac.css">
<link rel="stylesheet" href="css/07-divers.css">
<link rel="stylesheet" href="css/08-combat.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #ecran, #ecran * { font-family: 'Trebuchet MS', system-ui, sans-serif; font-weight: normal; }
  #ecran { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #cadre { position: relative; aspect-ratio: 4 / 3; height: min(100vh, 75vw); }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #noir { position: absolute; inset: 0; background: #000; pointer-events: none; opacity: 0; }
  #boite { position: absolute; left: 3%; right: 3%; bottom: 3%; min-height: 19%; background: #fff; border: 4px solid #4a5a8a; border-radius: 10px;
    box-shadow: inset 0 0 0 3px #c8d4f0; padding: 2.2% 3.5%; font-size: clamp(14px, 3.1vh, 30px); line-height: 1.45; color: #303030; white-space: pre-wrap; display: none; }
  #boite .suite { position: absolute; right: 3%; bottom: 8%; color: #d04040; animation: cligne 0.8s steps(2) infinite; }
  @keyframes cligne { 50% { opacity: 0; } }
  #choix { position: absolute; right: 3%; bottom: 26%; background: #fff; border: 4px solid #4a5a8a; border-radius: 10px; padding: 1% 3% 1% 5%;
    font-size: clamp(14px, 3.1vh, 30px); line-height: 1.6; color: #303030; display: none; }
  #choix div { position: relative; }
  #choix div.sel::before { content: '▶'; position: absolute; margin-left: -1.2em; color: #303030; }
  #zone { position: absolute; left: 2%; top: 3%; background: linear-gradient(#f8f0d8, #e8d8b0); border: 3px solid #8a6a3a; border-radius: 6px;
    padding: 0.6% 2.5%; font-size: clamp(13px, 2.8vh, 26px); color: #4a3418; transform: translateY(-260%); transition: transform 0.35s; }
  #zone.vu { transform: translateY(0); }
  #debug { position: absolute; left: 0.6%; bottom: 0.6%; font: 12px/1.35 monospace; color: #fff; background: rgba(0, 0, 0, 0.55); padding: 4px 6px; display: none; white-space: pre; pointer-events: none; }
  #aide { position: absolute; right: 0.6%; top: 0.6%; font: 12px/1.4 system-ui; color: #fff; background: rgba(0, 0, 0, 0.5); padding: 6px 8px; border-radius: 4px; }
  #chargement { position: absolute; inset: 0; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; }
</style>
</head>
<body>
<div id="ecran"><div id="cadre">
  <canvas id="vue"></canvas>
  <div id="noir"></div>
  <div id="zone"></div>
  <div id="boite"><span id="texte"></span><span class="suite">▼</span></div>
  <div id="choix"></div>
  <div id="debug"></div>
  <div id="aide">Flèches / ZQSD : marcher · Espace / Entrée : A · Échap : B · Tab / M : menu<br>Maj (ou B tenu) : courir · Verr. Maj : toujours courir · V : vélo · C : carte · O : sauvegarder · F3 : infos · G : rendu DS</div>
  <div id="chargement">Chargement…</div>
</div></div>
<div id="ui"></div>
<script type="importmap">
  { "imports": { "three": "../shared/vendor/three/three.module.min.js" } }
</script>
<script type="module" src="moteur/main.js"></script>
</body>
</html>
