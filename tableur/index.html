<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f7a4d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Sprezz</title>
  <link rel="stylesheet" href="css/tableur.css">
</head>
<body>
  <div id="app">
    <header id="barre-outils">
      <div class="groupe">
        <span class="logo" title="Sprezz — tableur dans le navigateur">▦ Sprezz</span>
        <button id="btn-nouveau" title="Nouveau classeur, ouvert à côté des autres (Ctrl+Alt+N)">Nouveau</button>
        <button id="btn-ouvrir" title="Ouvrir un fichier .xlsx / .xlsm / .csv / .docx (tableaux) / .bas (module VBA) (Ctrl+O)">Ouvrir…</button>
        <input type="file" id="fichier-image" accept="image/*" hidden>
        <input type="file" id="fichier" accept=".xlsx,.xlsm,.xls,.csv,.tsv,.ods,.docx,.bas,.cls,.frm" multiple hidden>
        <button id="btn-enregistrer" title="Télécharger le classeur (Ctrl+S)">Enregistrer</button>
        <select id="format-export" title="Format d'enregistrement">
          <option value="xlsx">.xlsx</option>
          <option value="xlsm">.xlsm (avec macros)</option>
          <option value="csv">.csv (feuille active)</option>
        </select>
      </div>
      <div class="groupe">
        <button id="btn-annuler" title="Annuler (Ctrl+Z)">↶</button>
        <button id="btn-retablir" title="Rétablir (Ctrl+Y)">↷</button>
        <span class="sep"></span>
        <button id="btn-pinceau" title="Reproduire la mise en forme : un clic pour une fois, double-clic pour plusieurs">🖌</button>
        <button id="btn-gras" title="Gras (Ctrl+B)"><b>G</b></button>
        <button id="btn-italique" title="Italique (Ctrl+I)"><i>I</i></button>
        <button id="btn-souligne" title="Souligné (Ctrl+U)"><u>S</u></button>
        <select id="taille-police" title="Taille de police">
          <option value="11">8</option><option value="12">9</option><option value="13">10</option><option value="15">11</option><option value="16">12</option>
          <option value="19">14</option><option value="21">16</option><option value="24">18</option><option value="27">20</option><option value="32">24</option><option value="37">28</option><option value="48">36</option>
        </select>
        <input type="color" id="couleur-texte" title="Couleur du texte" value="#000000">
        <input type="color" id="couleur-fond" title="Couleur de fond" value="#ffff99">
        <button id="btn-fond" title="Appliquer la couleur de fond">Fond</button>
        <button id="btn-sans-fond" title="Enlever la couleur de fond">⌫</button>
        <span class="sep"></span>
        <button data-align="left" title="Aligner à gauche">⇤</button>
        <button data-align="center" title="Centrer">↔</button>
        <button data-align="right" title="Aligner à droite">⇥</button>
        <button id="btn-fusion" title="Fusionner et centrer (ou dissocier)">⊞</button>
        <button id="btn-renvoi" title="Renvoyer à la ligne automatiquement">↵ Renvoi</button>
        <select id="bordures" title="Bordures">
          <option value="">▦ Bordures</option>
          <option value="toutes">Toutes les bordures</option>
          <option value="contour">Contour</option>
          <option value="contour-epais">Contour épais</option>
          <option value="bas">Bordure inférieure</option>
          <option value="bas-epais">Bordure inférieure épaisse</option>
          <option value="haut">Bordure supérieure</option>
          <option value="gauche">Bordure gauche</option>
          <option value="droite">Bordure droite</option>
          <option value="aucune">Aucune bordure</option>
        </select>
        <span class="sep"></span>
        <select id="format-nombre" title="Format de nombre">
          <option value="">Standard</option>
          <option value="0">0</option>
          <option value="0.00">0,00</option>
          <option value="#,##0">1 000</option>
          <option value="#,##0.00">1 000,00</option>
          <option value="0%">0 %</option>
          <option value="0.00%">0,00 %</option>
          <option value="#,##0.00 €">Monétaire</option>
          <option value="0.00E+00">Scientifique</option>
          <option value="dd/mm/yyyy">Date jj/mm/aaaa</option>
          <option value="dd/mm/yyyy hh:mm">Date et heure</option>
          <option value="hh:mm">Heure</option>
          <option value="@">Texte</option>
        </select>
        <button id="btn-decimales-moins" title="Moins de décimales">,0</button>
        <button id="btn-decimales-plus" title="Plus de décimales">,00</button>
      </div>
      <div class="groupe">
        <button id="btn-somme" title="Somme automatique (Alt+=)">Σ</button><button id="btn-somme-menu" class="fleche" title="Moyenne, Nb, Max, Min">▾</button>
        <button id="btn-trier" title="Trier et filtrer">⇅ Trier</button>
        <button id="btn-filtrer" title="Filtre automatique : ▾ dans les en-têtes (Ctrl+Maj+L)">⧩ Filtrer</button>
        <button id="btn-rechercher" title="Rechercher et remplacer (Ctrl+F, Ctrl+H)">🔍</button>
        <button id="btn-tcd" title="Tableau croisé dynamique">📊 Croisé</button>
        <button id="btn-mfc" title="Mise en forme conditionnelle">🎨 Conditionnelle</button>
        <button id="btn-figer" title="Figer les volets, masquer des lignes ou des colonnes">❄ Figer</button>
        <button id="btn-plus" title="Valeur cible, impression, recalcul">⋯</button>
      </div>
      <div class="groupe">
        <button id="btn-inserer-ligne" title="Insérer une ligne au-dessus">+ Ligne</button>
        <button id="btn-supprimer-ligne" title="Supprimer la ou les lignes">− Ligne</button>
        <button id="btn-inserer-colonne" title="Insérer une colonne à gauche">+ Col.</button>
        <button id="btn-supprimer-colonne" title="Supprimer la ou les colonnes">− Col.</button>
        <span class="sep"></span>
        <button id="btn-graphique" title="Insérer un graphique à partir de la sélection (galerie avec aperçus)">📈 Graphique</button>
        <button id="btn-bouton" title="Insérer un bouton qui lance une macro VBA (sur la sélection)">🔘 Bouton</button>
        <span class="sep"></span>
        <button id="btn-noms" title="Noms définis">Noms</button>
        <button id="btn-fonctions" title="Liste des fonctions">ƒx</button>
        <button id="btn-macros-liste" title="Macros du classeur : exécuter, modifier, créer, supprimer (Alt+F8)">Macros</button>
        <button id="btn-macros" title="Éditeur de macros VBA : modules de chaque feuille et modules nommés (Alt+F11)">VBA</button>
        <button id="btn-aide" title="Aide">?</button>
      </div>
    </header>
    <nav id="barre-classeurs" title="Classeurs ouverts">
      <div id="liste-classeurs"></div>
      <button id="btn-nouveau-classeur" title="Nouveau classeur">+</button>
    </nav>
    <div id="barre-formule">
      <button id="btn-outils" title="Afficher ou masquer les outils">▴</button>
      <input id="zone-nom" title="Cellule active ou nom à définir" value="A1" spellcheck="false">
      <span class="fx">ƒx</span>
      <textarea id="saisie-formule" rows="1" spellcheck="false" placeholder="Saisie ou formule (=SOMME(A1:A5), =SI(…), =VPM(…))"></textarea>
    </div>
    <div id="corps">
      <div id="grille-conteneur" tabindex="0">
        <div id="grille-dimension"></div>
        <div id="grille-coins">
          <div id="coin"></div>
          <div id="entetes-colonnes"></div>
          <div id="entetes-lignes"></div>
          <div id="volets"></div>
        </div>
        <div id="cellules"></div>
        <div id="selection"></div>
        <div id="curseur"></div>
        <div id="poignee" title="Recopier"></div>
        <button id="puce-lien" title="Ouvrir le lien" hidden>↗</button>
        <button id="fleche-liste" title="Choisir dans la liste (Alt+↓)" hidden>▾</button>
        <div id="message-validation" hidden></div>
        <textarea id="editeur" rows="1" spellcheck="false" hidden></textarea>
        <div id="plage-copie" hidden></div>
        <div id="fantome" hidden></div>
        <div id="zone-debord" hidden></div>
      </div>
      <aside id="panneau" hidden>
        <div id="panneau-entete">
          <span id="panneau-titre">Macros VBA</span>
          <button id="panneau-fermer" title="Fermer">✕</button>
        </div>
        <div id="panneau-macros" class="panneau-contenu">
          <div id="projet-vba">
            <div class="projet-barre">
              <span class="projet-titre">Projet VBA</span>
              <button id="btn-nouveau-module" title="Insérer un module standard nommé">+ Module</button>
              <button id="btn-nouvelle-macro" title="Créer une macro nommée dans le module affiché">+ Macro</button>
              <button id="btn-liste-macros" title="Toutes les macros du classeur (Alt+F8)">Macros…</button>
            </div>
            <div id="arbre-vba" class="arbre"></div>
          </div>
          <div class="module-entete"><span class="module-label">Code :</span> <span id="module-titre">Module1</span></div>
          <div class="panneau-barre">
            <select id="liste-procedures" title="Macro à exécuter (celle où se trouve le curseur est choisie d'office)"></select>
            <button id="btn-executer" title="Exécuter (F5)">▶ Exécuter</button>
            <button id="btn-verifier" title="Vérifier la syntaxe">Vérifier</button>
            <button id="btn-exemple" title="Insérer un exemple">Exemple</button>
          </div>
          <textarea id="code-vba" spellcheck="false" placeholder="Sub MaMacro()&#10;  Range(&quot;A1&quot;).Value = 42&#10;End Sub"></textarea>
          <div id="sortie-vba"></div>
        </div>
        <div id="panneau-fonctions" class="panneau-contenu" hidden>
          <input id="filtre-fonctions" placeholder="Filtrer (SOMME, VPM, LOI.NORMALE…)">
          <div id="liste-fonctions"></div>
        </div>
        <div id="panneau-noms" class="panneau-contenu" hidden>
          <div class="panneau-barre">
            <input id="nom-nouveau" placeholder="Nom (ex. Taux)">
            <input id="ref-nouveau" placeholder="Référence (ex. Feuil1!$B$2)">
            <button id="btn-ajouter-nom">Ajouter</button>
          </div>
          <div id="liste-noms"></div>
        </div>
        <div id="panneau-aide" class="panneau-contenu" hidden></div>
        <div id="panneau-graphique" class="panneau-contenu" hidden></div>
        <div id="panneau-rechercher" class="panneau-contenu" hidden></div>
        <div id="panneau-tri" class="panneau-contenu" hidden></div>
        <div id="panneau-mfc" class="panneau-contenu" hidden></div>
        <div id="panneau-cible" class="panneau-contenu" hidden></div>
        <div id="panneau-validation" class="panneau-contenu" hidden></div>
        <div id="panneau-tcd" class="panneau-contenu" hidden></div>
      </aside>
    </div>
    <footer id="onglets">
      <button id="btn-ajouter-feuille" title="Nouvelle feuille">+</button>
      <div id="liste-onglets"></div>
      <div id="statut"></div>
    </footer>
  </div>
  <div id="dialogue-macros" class="dialogue-fond" hidden>
    <div class="dialogue" role="dialog" aria-labelledby="dialogue-macros-titre">
      <div class="dialogue-titre" id="dialogue-macros-titre">Macros</div>
      <div class="dialogue-corps">
        <div class="dialogue-gauche">
          <label for="macro-nom">Nom de la macro :</label>
          <input id="macro-nom" spellcheck="false" autocomplete="off" placeholder="ex. CalculerProvisions">
          <div id="macros-liste"></div>
          <label for="macros-dans">Macros dans :</label>
          <select id="macros-dans"></select>
        </div>
        <div class="dialogue-boutons">
          <button id="macro-executer">Exécuter</button>
          <button id="macro-modifier">Modifier</button>
          <button id="macro-creer">Créer</button>
          <button id="macro-supprimer">Supprimer</button>
          <span class="espace"></span>
          <button id="macro-fermer">Fermer</button>
        </div>
      </div>
    </div>
  </div>
  <div id="menu-contextuel" class="menu" hidden></div>
  <div id="toast" hidden></div>
  <div id="dialogue-mdp" class="voile" hidden>
    <div class="dialogue" role="dialog" aria-labelledby="mdp-titre">
      <h3 id="mdp-titre">🔒 Fichier protégé par mot de passe</h3>
      <p><b id="mdp-fichier"></b> est chiffré. Entrez son mot de passe pour l'ouvrir.</p>
      <input id="mdp-saisie" type="password" autocomplete="off" placeholder="Mot de passe">
      <label class="mdp-voir"><input type="checkbox" id="mdp-voir"> afficher</label>
      <p id="mdp-message" class="mdp-erreur"></p>
      <p id="mdp-attente" hidden>Déchiffrement…</p>
      <div class="dialogue-boutons"><button id="mdp-annuler">Annuler</button><button id="mdp-ok" class="principal">Ouvrir</button></div>
    </div>
  </div>
  <script src="lib/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
