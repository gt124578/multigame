<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Odyssée — PixelForge : prototype de bâtiments en vrais volumes 3D (comme les modèles de HeartGold / SoulSilver),
     rendus avec la caméra du jeu, à la résolution du jeu (?hd=0 : 32 px par case) ou doublée (?hd=1 : 64 px par case).
     Ouvrir depuis la racine du dépôt servie en local : /tools/pixelforge/batiments3d.html?hd=0&cx=10 -->
<title>Bâtiments 3D — prototype</title>
<style>html,body{margin:0;background:#1d4f2a}canvas{display:block;image-rendering:pixelated}</style>
<script type="importmap">{ "imports": { "three": "../../shared/vendor/three/three.module.min.js" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { rendreBloc, LUT, K, CELL } from '../../odyssee/js/render/solgen.js';

const Q = new URLSearchParams(location.search);
const HD = Q.get('hd') === '1', D = HD ? 64 : 32;              // pixels par case (rendu et textures)
const EL = 55 * Math.PI / 180, FOV = 13, YS = Math.tan(EL);     // comme world3d.js : hauteurs étirées de tan(EL)
const IW = 25 * D, IH = 14 * D;                                  // image interne : 25 × 14 cases
const ZOOM = HD ? 1 : 2;                                         // affichage : même taille à l'écran

/* ------------------------------------------------------------ textures pixel art, D px par unité ---------------- */
const hash = (x, y, s = 0) => { let h = (x * 374761393 + y * 668265263 + s * 974711) ^ 0x5bd1e995; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const hex = (c) => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const mix = (c, f) => { const [r, g, b] = hex(c); const m = (v) => Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f); return `rgb(${m(r)},${m(g)},${m(b)})`; };
function canvasTex(w, h, draw, rep = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  const px = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y, 1, 1); };
  draw(g, px, w, h);
  const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.colorSpace = THREE.SRGBColorSpace; if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const S = D / 32;                                                // échelle des motifs
const TX = {
  enduit: (col) => canvasTex(D, D, (g, px, w, h) => { g.fillStyle = col; g.fillRect(0, 0, w, h); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const u = hash(x, y, 1); if (u < 0.06) px(x, y, mix(col, -0.07)); else if (u > 0.96) px(x, y, mix(col, 0.25)); } }),
  tuiles: (col) => canvasTex(D, D, (g, px, w, h) => {
    const rh = 8 * S, tw = 10 * S;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const row = Math.floor(y / rh), ly = y % rh, lx = (x + (row % 2) * tw / 2) % tw;
      let f = 0; if (ly < 1 * S) f = 0.25; if (ly > rh * 0.7) f = -0.25; if (lx < 1 * S && ly < rh * 0.8) f = -0.3;
      if (ly >= rh - 1 * S) f = -0.45; if (ly > rh * 0.55 && (lx < 1.5 * S || lx > tw - 1.5 * S)) f = -0.4;
      if (hash(Math.floor((x + (row % 2) * tw / 2) / tw), row, 3) < 0.15 && f === 0) f = 0.12;
      px(x, y, mix(col, f));
    }
  }),
  ardoise: () => canvasTex(D, D, (g, px, w, h) => { const rh = 6 * S, tw = 8 * S; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const row = Math.floor(y / rh), ly = y % rh, lx = (x + (row % 2) * tw / 2) % tw; let c = hash(Math.floor((x + (row % 2) * tw / 2) / tw), row, 5) < 0.3 ? '#4a5266' : '#3c4354'; if (ly === 0) c = '#626b80'; if (ly >= rh - S || lx < S) c = '#262a36'; px(x, y, c); } }),
  tole: (col) => canvasTex(D, D, (g, px, w, h) => { for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const lx = x % (8 * S); px(x, y, mix(col, lx < S ? 0.25 : lx < 2 * S ? 0.1 : lx > 6 * S ? -0.2 : 0)); } }),
  pierre: () => canvasTex(D, D, (g, px, w, h) => { const rh = 8 * S, tw = 16 * S; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const row = Math.floor(y / rh), ly = y % rh, lx = (x + (row % 2) * tw / 2) % tw; const id = hash(Math.floor((x + (row % 2) * tw / 2) / tw), row, 7); let c = id < 0.3 ? '#b8b2a6' : id < 0.7 ? '#c8c2b6' : '#d4cec2'; if (ly < S || lx < S) c = '#e2ddd2'; if (ly >= rh - S || lx >= tw - S) c = '#8a847a'; px(x, y, c); } }),
  bois: () => canvasTex(D, D, (g, px, w, h) => { for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const lx = x % (6 * S); px(x, y, lx < S ? '#4e301c' : hash(x >> 1, y >> 3, 9) < 0.15 ? '#7a4e2c' : '#8e5c36'); } }),
  verre: () => canvasTex(D, D, (g, px, w, h) => { for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const t = y / h, d = (x + y) % Math.round(22 * S); px(x, y, d < 2 * S ? '#d8ecff' : d < 4 * S ? '#9cc0e8' : t < 0.5 ? '#5a7cb0' : '#36507a'); } }, false),
  etals: () => canvasTex(2 * D, D, (g, px, w, h) => { g.fillStyle = '#36507a'; g.fillRect(0, 0, w, h); const C = ['#e24a4a', '#f6d84a', '#7aa0f8', '#7acc6a', '#f08ac0', '#f8a040', '#ffffff']; for (const sy of [0.33, 0.66, 0.97]) { const y0 = Math.round(sy * h); g.fillStyle = '#5a3a22'; g.fillRect(0, y0 - S, w, 2 * S); let x = 2; while (x < w - 2) { const ww = Math.round((3 + hash(x, y0, 2) * 3) * S), hh = Math.round((5 + hash(x, y0, 3) * 4) * S); g.fillStyle = C[Math.floor(hash(x, y0, 4) * C.length)]; g.fillRect(x, y0 - S - hh, ww, hh); x += ww + S; } } }, false),
  store: () => canvasTex(D, D, (g, px, w, h) => { for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) px(x, y, Math.floor(x / (8 * S)) % 2 ? '#f4f4f6' : '#3a68c8'); }),
  croix: () => canvasTex(D, D, (g, px, w, h) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); g.fillStyle = '#d8343a'; g.fillRect(w * 0.38, h * 0.16, w * 0.24, h * 0.68); g.fillRect(w * 0.16, h * 0.38, w * 0.68, h * 0.24); }, false),
  sac: () => canvasTex(D, D, (g, px, w, h) => { g.fillStyle = '#284a9c'; g.fillRect(0, 0, w, h); g.fillStyle = '#ffffff'; g.fillRect(w * 0.28, h * 0.4, w * 0.44, h * 0.42); g.fillRect(w * 0.36, h * 0.24, w * 0.06, h * 0.18); g.fillRect(w * 0.58, h * 0.24, w * 0.06, h * 0.18); g.fillRect(w * 0.36, h * 0.24, w * 0.28, h * 0.05); }, false),
};

/* ------------------------------------------------------------ matériaux : ombrage en 3 paliers, net comme sur DS -- */
const paliers = (() => { const d = new Uint8Array([90, 160, 225, 255]); const t = new THREE.DataTexture(d, 4, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const M = (o) => { const m = new THREE.MeshToonMaterial({ gradientMap: paliers, ...o }); return m; };
const COL = (c) => M({ color: new THREE.Color(c) });

/** boîte dont les coordonnées de texture suivent la taille réelle (1 unité = 1 répétition) */
function boite(w, h, d, mat) {
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv, dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) { const i = f * 4 + k; uv.setXY(i, uv.getX(i) * dims[f][0], uv.getY(i) * dims[f][1]); }
  const m = new THREE.Mesh(g, mat); m.castShadow = m.receiveShadow = true; return m;
}
const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };

/* ------------------------------------------------------------ éléments ------------------------------------------ */
function fenetre(G, x, y, z, w, h, cadre, volets = null, fleurs = null) {
  const verre = M({ map: TX.verre() });
  G.add(at(boite(w, h, 0.02, verre), x, y, z + 0.005));
  for (const [dx, dy, ww, hh] of [[0, h / 2, w + 0.12, 0.06], [0, -h / 2, w + 0.12, 0.06], [-w / 2, 0, 0.06, h], [w / 2, 0, 0.06, h], [0, 0, 0.04, h], [0, 0, w, 0.04]])
    G.add(at(boite(ww, hh, 0.08, cadre), x + dx, y + dy, z + 0.04));
  G.add(at(boite(w + 0.24, 0.06, 0.18, cadre), x, y - h / 2 - 0.05, z + 0.09));     // appui
  if (volets) for (const s of [-1, 1]) G.add(at(boite(w * 0.42, h + 0.06, 0.05, volets), x + s * (w / 2 + w * 0.24), y, z + 0.03));
  if (fleurs) {
    G.add(at(boite(w + 0.1, 0.12, 0.16, COL('#7a4e2c')), x, y - h / 2 - 0.14, z + 0.12));
    for (let i = 0; i < 7; i++) G.add(at(boite(0.08, 0.08, 0.08, COL(fleurs[i % fleurs.length])), x - w / 2 + 0.08 + i * (w / 6.5), y - h / 2 - 0.04, z + 0.13 + (i % 2) * 0.04));
  }
}
function porte(G, x, z, w, h, mat, cadre) {
  G.add(at(boite(w, h, 0.03, mat), x, h / 2 + 0.3, z + 0.01));
  for (const [dx, dy, ww, hh] of [[0, h + 0.04, w + 0.2, 0.08], [-w / 2 - 0.05, h / 2, 0.08, h], [w / 2 + 0.05, h / 2, 0.08, h]]) G.add(at(boite(ww, hh, 0.1, cadre), x + dx, dy + 0.3, z + 0.03));
  G.add(at(boite(0.05, 0.05, 0.05, COL('#f0d060')), x + w * 0.3, h * 0.5 + 0.3, z + 0.04));
  G.add(at(boite(w + 0.5, 0.15, 0.4, M({ map: TX.pierre() })), x, 0.22, z + 0.2)); G.add(at(boite(w + 0.7, 0.15, 0.5, M({ map: TX.pierre() })), x, 0.07, z + 0.3));   // marches
}
/** toit à deux pans (faîtage le long de x), débord, épaisseur, pignons */
function toit2(G, x0, x1, z0, z1, y, hr, mat, pignon, deb = 0.28) {
  const w = x1 - x0 + 2 * deb, dz = (z1 - z0) / 2 + deb, L = Math.hypot(dz, hr), a = Math.atan2(hr, dz), cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
  for (const s of [-1, 1]) {
    const p = boite(w, 0.1, L, mat); p.rotation.x = s * a;
    at(p, cx, y + hr / 2 + 0.05, cz + s * dz / 2); G.add(p);
  }
  G.add(at(boite(w, 0.12, 0.16, COL('#5a3a2a')), cx, y + hr + 0.08, cz));                 // faîtière
  const sh = new THREE.Shape(); sh.moveTo(-(z1 - z0) / 2, 0); sh.lineTo((z1 - z0) / 2, 0); sh.lineTo(0, hr); sh.closePath();
  for (const xx of [x0 + 0.01, x1 - 0.01]) { const gm = new THREE.Mesh(new THREE.ShapeGeometry(sh), pignon); gm.rotation.y = Math.PI / 2 * (xx < cx ? -1 : 1); gm.position.set(xx, y, cz); gm.castShadow = true; G.add(gm); }
}

/* ------------------------------------------------------------ bâtiments ------------------------------------------ */
function maison(x0, z0, toitCol, murCol, fleurs) {
  const G = new THREE.Group(), w = 5, d = 4, H = 2.1, x1 = x0 + w, z1 = z0 + d, cx = x0 + w / 2;
  G.add(at(boite(w + 0.1, 0.3, d + 0.1, M({ map: TX.pierre() })), cx, 0.15, z0 + d / 2));
  G.add(at(boite(w, H, d, M({ map: TX.enduit(murCol) })), cx, H / 2 + 0.3, z0 + d / 2));
  for (const xx of [x0 + 0.06, x1 - 0.06]) G.add(at(boite(0.14, H, 0.14, COL('#8e5c36')), xx, H / 2 + 0.3, z1));   // colombages d'angle
  toit2(G, x0, x1, z0, z1, H + 0.3, 1.5, M({ map: TX.tuiles(toitCol) }), M({ map: TX.enduit(murCol), side: THREE.DoubleSide }));
  G.add(at(boite(0.6, 1.1, 0.6, M({ map: TX.pierre(), color: new THREE.Color('#c87a60') })), x1 - 1.1, H + 1.5, z0 + 1.2));   // cheminée
  G.add(at(boite(0.75, 0.1, 0.75, COL('#5a5552')), x1 - 1.1, H + 2.07, z0 + 1.2));
  // lucarne sur le pan avant
  G.add(at(boite(1.0, 0.8, 0.9, M({ map: TX.enduit(murCol) })), cx, H + 1.0, z1 - 0.8));
  toit2(G, cx - 0.5, cx + 0.5, z1 - 1.25, z1 - 0.35, H + 1.4, 0.4, M({ map: TX.tuiles(toitCol) }), M({ map: TX.enduit(murCol), side: THREE.DoubleSide }), 0.1);
  fenetre(G, cx, H + 1.0, z1 - 0.34, 0.5, 0.42, COL('#f4f0e6'));
  const bois = COL('#6a4228'), vol = COL(toitCol);
  fenetre(G, x0 + 1.0, 1.55, z1, 0.8, 0.65, COL('#f4f0e6'), vol, fleurs);
  fenetre(G, x1 - 1.0, 1.55, z1, 0.8, 0.65, COL('#f4f0e6'), vol, fleurs);
  porte(G, cx, z1, 0.75, 1.3, M({ map: TX.bois() }), bois);
  G.add(at(boite(0.14, 0.22, 0.14, M({ color: new THREE.Color('#fff4c0'), emissive: new THREE.Color('#806020') })), cx + 0.65, 1.3, z1 + 0.1));
  return G;
}
function centre(x0, z0) {
  const G = new THREE.Group(), w = 6, d = 4, H = 2.3, x1 = x0 + w, z1 = z0 + d, cx = x0 + w / 2;
  G.add(at(boite(w, H, d, M({ map: TX.enduit('#eceef2') })), cx, H / 2, z0 + d / 2));
  G.add(at(boite(w + 0.3, 0.32, d + 0.3, M({ map: TX.tole('#d0403c') })), cx, H + 0.16, z0 + d / 2));           // toit plat
  G.add(at(boite(w + 0.34, 0.2, 0.12, COL('#ffffff')), cx, H + 0.02, z1 + 0.15));                           // corniche
  G.add(at(boite(w, 0.18, 0.04, COL('#d0403c')), cx, 0.45, z1 + 0.02));                                      // bande rouge
  for (const xx of [x0 + 1.25, x1 - 1.25]) fenetre(G, xx, 1.25, z1, 1.4, 0.9, COL('#c6c8d0'));
  G.add(at(boite(1.6, 1.45, 0.03, M({ map: TX.verre() })), cx, 0.73, z1 + 0.01));                         // portes vitrées
  for (const dx of [-0.82, 0, 0.82]) G.add(at(boite(0.06, 1.45, 0.08, COL('#8c8e96')), cx + dx, 0.73, z1 + 0.04));
  const auvent = boite(2.2, 0.08, 0.7, COL('#d0403c')); auvent.rotation.x = 0.25; G.add(at(auvent, cx, 1.62, z1 + 0.32));
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.14, 24), [COL('#e4e6ec'), M({ map: TX.croix() }), COL('#e4e6ec')]);
  disc.rotation.x = Math.PI / 2; disc.castShadow = true; G.add(at(disc, cx, H + 0.9, z1 - 0.2));
  G.add(at(boite(0.12, 0.6, 0.12, COL('#8c8e96')), cx, H + 0.45, z1 - 0.3));
  return G;
}
function boutique(x0, z0) {
  const G = new THREE.Group(), w = 5, d = 4, H = 2.1, x1 = x0 + w, z1 = z0 + d;
  G.add(at(boite(w, H, d, M({ map: TX.enduit('#ece4d0') })), x0 + w / 2, H / 2, z0 + d / 2));
  G.add(at(boite(w + 0.3, 0.32, d + 0.3, M({ map: TX.tole('#3a68c8') })), x0 + w / 2, H + 0.16, z0 + d / 2));
  G.add(at(boite(w + 0.34, 0.24, 0.12, COL('#284a9c')), x0 + w / 2, H + 0.02, z1 + 0.15));
  const ens = boite(1.4, 0.75, 0.1, [COL('#1a2e6a'), COL('#1a2e6a'), COL('#1a2e6a'), COL('#1a2e6a'), M({ map: TX.sac() }), COL('#1a2e6a')]); G.add(at(ens, x0 + w / 2, H + 0.75, z1 - 0.1));
  G.add(at(boite(2.6, 1.1, 0.03, M({ map: TX.etals() })), x0 + 1.6, 1.0, z1 + 0.01));                      // vitrine
  for (const [dx, dy, ww, hh] of [[0, 0.58, 2.7, 0.08], [0, -0.58, 2.7, 0.08], [-1.32, 0, 0.08, 1.2], [1.32, 0, 0.08, 1.2]]) G.add(at(boite(ww, hh, 0.08, COL('#c4bca8')), x0 + 1.6 + dx, 1.0 + dy, z1 + 0.04));
  const st = boite(2.9, 0.06, 0.8, M({ map: TX.store() })); st.rotation.x = 0.35; G.add(at(st, x0 + 1.6, 1.82, z1 + 0.36));
  G.add(at(boite(1.1, 1.45, 0.03, M({ map: TX.verre() })), x1 - 1.05, 0.73, z1 + 0.01));
  for (const dx of [-0.57, 0, 0.57]) G.add(at(boite(0.06, 1.45, 0.08, COL('#6e7480')), x1 - 1.05 + dx, 0.73, z1 + 0.04));
  G.add(at(boite(0.6, 0.35, 0.4, M({ map: TX.bois() })), x0 + 0.9, 0.18, z1 + 0.4));                       // caisse de pommes
  for (let i = 0; i < 4; i++) G.add(at(boite(0.11, 0.11, 0.11, COL('#e24a4a')), x0 + 0.68 + i * 0.15, 0.4, z1 + 0.4));
  return G;
}
function arene(x0, z0, acc) {
  const G = new THREE.Group(), w = 8, d = 5, H = 2.6, x1 = x0 + w, z1 = z0 + d, cx = x0 + w / 2;
  G.add(at(boite(w, H, d, M({ map: TX.pierre() })), cx, H / 2, z0 + d / 2));
  G.add(at(boite(w + 0.3, 0.24, d + 0.3, COL(acc)), cx, H + 0.12, z0 + d / 2));
  toit2(G, x0 + 0.2, x1 - 0.2, z0 + 0.2, z1 - 0.2, H + 0.24, 1.6, M({ map: TX.ardoise() }), M({ map: TX.pierre(), side: THREE.DoubleSide }), 0.2);
  for (const xx of [x0 + 0.8, x0 + 2.2, x1 - 2.2, x1 - 0.8]) {
    const c = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.24, H - 0.3, 12), COL('#e2ddd2')); c.castShadow = true; G.add(at(c, xx, H / 2, z1 + 0.25));
    G.add(at(boite(0.6, 0.16, 0.6, COL('#cec8bc')), xx, H - 0.08, z1 + 0.25)); G.add(at(boite(0.6, 0.16, 0.6, COL('#cec8bc')), xx, 0.08, z1 + 0.25));
  }
  // porte en arc
  G.add(at(boite(1.5, 1.7, 0.04, M({ map: TX.bois() })), cx, 0.85, z1 + 0.01));
  const arc = new THREE.Mesh(new THREE.TorusGeometry(0.78, 0.1, 6, 16, Math.PI), COL(acc)); arc.castShadow = true; G.add(at(arc, cx, 1.65, z1 + 0.06));
  const tym = new THREE.Mesh(new THREE.CircleGeometry(0.72, 16, 0, Math.PI), M({ map: TX.bois() })); G.add(at(tym, cx, 1.68, z1 + 0.02));
  for (const s of [-1, 1]) G.add(at(boite(0.16, 1.7, 0.16, COL(acc)), cx + s * 0.8, 0.85, z1 + 0.06));
  // médaillon en losange au-dessus
  const lo = boite(0.9, 0.9, 0.12, COL(acc)); lo.rotation.z = Math.PI / 4; G.add(at(lo, cx, H + 0.75, z1 - 0.35));
  const lo2 = boite(0.45, 0.45, 0.14, COL('#f4f0e6')); lo2.rotation.z = Math.PI / 4; G.add(at(lo2, cx, H + 0.75, z1 - 0.3));
  for (const s of [-1, 1]) { const b = boite(0.4, 1.0, 0.03, COL(acc)); G.add(at(b, cx + s * 2.9, 1.6, z1 + 0.03)); }
  for (let k = 0; k < 3; k++) G.add(at(boite(2.4 + k * 0.6, 0.12, 0.3, M({ map: TX.pierre() })), cx, 0.06 + (2 - k) * 0.12 - 0.12 * (2 - k) + 0.06, z1 + 0.15 + k * 0.3));
  for (const s of [-1, 1]) { G.add(at(boite(0.14, 0.4, 0.14, COL('#3e3a38')), cx + s * 1.05, 1.3, z1 + 0.12)); G.add(at(boite(0.12, 0.16, 0.12, M({ color: new THREE.Color('#ffb040'), emissive: new THREE.Color('#ff7a00') })), cx + s * 1.05, 1.55, z1 + 0.12)); }
  return G;
}

/* ------------------------------------------------------------ scène ---------------------------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(IW, IH, false);
renderer.domElement.style.width = IW * ZOOM + 'px'; renderer.domElement.style.height = IH * ZOOM + 'px';
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.BasicShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#1d4f2a');

// sol : le sol généré du jeu (herbe, rue pavée, chemin), 44 × 20 cases
const SW = 44, SH = 20, MG = 2, kinds = new Uint8Array((SW + 2 * MG) * (SH + 2 * MG)).fill(K.G);
for (let y = 0; y < SH + 2 * MG; y++) for (let x = 0; x < SW + 2 * MG; x++) {
  const gy = y - MG, gx = x - MG;
  if (gy >= 11 && gy <= 13) kinds[y * (SW + 2 * MG) + x] = K.V;
  if (gy > 13 && (gx === 21 || gx === 22)) kinds[y * (SW + 2 * MG) + x] = K.P;
}
const fr = rendreBloc({ kinds, zw: SW + 2 * MG, zh: SH + 2 * MG, zx0: 200 - MG, zy0: 300 - MG, bw: SW, bh: SH, seed: 5 })[0];
const data = new Uint8Array(SW * CELL * SH * CELL * 4), u32 = new Uint32Array(data.buffer);
for (let i = 0; i < fr.length; i++) u32[i] = LUT[fr[i]];
const gt = new THREE.DataTexture(data, SW * CELL, SH * CELL); gt.magFilter = gt.minFilter = THREE.NearestFilter; gt.colorSpace = THREE.SRGBColorSpace; gt.needsUpdate = true; gt.flipY = false;
const gg = new THREE.PlaneGeometry(SW, SH); gg.rotateX(-Math.PI / 2);
const uvs = gg.attributes.uv; for (let i = 0; i < uvs.count; i++) uvs.setY(i, 1 - uvs.getY(i));
const ground = new THREE.Mesh(gg, new THREE.MeshBasicMaterial({ map: gt })); ground.position.set(SW / 2, 0, SH / 2); scene.add(ground);
const sg = new THREE.PlaneGeometry(SW, SH); sg.rotateX(-Math.PI / 2);
const shadowPlane = new THREE.Mesh(sg, new THREE.ShadowMaterial({ color: 0x0a2a14, opacity: 0.38 })); shadowPlane.position.set(SW / 2, 0.003, SH / 2); shadowPlane.receiveShadow = true; scene.add(shadowPlane);

// bâtiments (étirés en hauteur de tan(EL), comme le jeu)
const B = new THREE.Group(); B.scale.y = YS; scene.add(B);
B.add(maison(1, 6, '#c8483c', '#f2e6c8', ['#f05a6a', '#f8d850', '#fafaf2']));
B.add(maison(7, 6, '#3a68c8', '#efe4cc', ['#7aa0f8', '#fafaf2']));
B.add(centre(13.5, 6));
B.add(boutique(23, 6));
B.add(arene(29.5, 5, '#e07030'));
B.add(maison(39, 6, '#4a9a4a', '#f4ecd8', ['#f08ac0', '#fafaf2']));

// lumière : soleil en haut à gauche, ciel, ombres nettes
scene.add(new THREE.HemisphereLight(0xdfefff, 0x6a8a5a, 1.1));
const sun = new THREE.DirectionalLight(0xfff2dc, 2.2); sun.position.set(-8, 14, 9); sun.target.position.set(0, 0, 0);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); const sc = sun.shadow.camera; sc.left = -30; sc.right = 30; sc.top = 30; sc.bottom = -30; sc.near = 1; sc.far = 80; sun.shadow.bias = -0.0008;
const rig = new THREE.Group(); rig.add(sun); rig.add(sun.target); scene.add(rig);

// caméra du jeu
const camera = new THREE.PerspectiveCamera(FOV, IW / IH, 0.5, 400);
camera.updateProjectionMatrix(); camera.projectionMatrix.elements[0] *= Math.sin(EL); camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
const dist = (Math.sin(EL) * IH) / (2 * Math.tan(FOV * Math.PI / 360) * D);
const cx = +(Q.get('cx') || 12), cz = +(Q.get('cz') || 10);
camera.position.set(cx, dist * Math.sin(EL), cz + dist * Math.cos(EL)); camera.lookAt(cx, 0, cz);
rig.position.set(cx, 0, cz);
renderer.render(scene, camera);
window.done = true;
